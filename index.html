<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jens</title>
<style>
  :root {
    --bg: #f7f5f2;
    --card: #ffffff;
    --text: #2b2b2b;
    --muted: #6b6b6b;
    --accent: #4a5d4f;
    --border: #e6e2db;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 2rem 1rem;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2.5rem;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
  }

  .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    font-weight: 600;
    margin: 0 auto 1.25rem;
  }

  h1 {
    margin: 0 0 0.25rem;
    font-size: 1.6rem;
    font-weight: 700;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0 0 1.5rem;
  }

  .info {
    font-size: 0.95rem;
    line-height: 1.6;
    margin: 0 0 1.5rem;
    color: var(--text);
  }

  .info strong {
    color: var(--accent);
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: center;
    margin-bottom: 1.75rem;
  }

  .tag {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.35rem 0.85rem;
    border-radius: 999px;
    font-size: 0.85rem;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .links a {
    text-decoration: none;
    color: white;
    background: var(--accent);
    padding: 0.7rem 1rem;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 500;
    transition: opacity 0.15s ease;
  }

  .links a:hover {
    opacity: 0.85;
  }

  footer {
    margin-top: 2rem;
    font-size: 0.8rem;
    color: var(--muted);
  }
</style>
</head>
<body>

  <div class="card">
    <div class="avatar">J</div>
    <h1>Jens</h1>
    <p class="subtitle">19 jaar</p>

    <p class="info">
      Ik start op <strong>7 september</strong> met de studie <strong>PPE</strong>
      aan de <strong>Universiteit Utrecht</strong>.
    </p>

    <div class="tags">
      <span class="tag">🏋️ Gymmen</span>
      <span class="tag">⚽ Voetbal</span>
      <span class="tag">📚 Lezen</span>
    </div>

    <div class="links">
      <a href="https://www.instagram.com/jens_rms/" target="_blank" rel="noopener noreferrer">Instagram</a>
    </div>

    <footer>&copy; 2026 Jens</footer>
  </div>

</body>
</html>
